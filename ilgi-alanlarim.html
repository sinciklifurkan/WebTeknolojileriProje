<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <!-- Responsive görünüm için viewport ayarı -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlgi Alanlarım - Film Arama</title>
    <!-- Projenin ortak stil dosyası -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== SAYFA BAŞLIĞI VE NAVİGASYON ===== -->
    <header>
        <h1>İlgi Alanlarım</h1>

        <!-- Tüm sayfalara ulaşmak için navigasyon menüsü -->
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="hakkinda.html">Hakkında</a>
            <a href="cv.html">CV</a>
            <a href="sehrim.html">Şehrim</a>
            <a href="mirasimiz.html">Mirasımız</a>
            <a href="ilgi-alanlarim.html">İlgi Alanlarım</a>
            <a href="iletisim.html">İletişim</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- ===== ANA İÇERİK ===== -->
    <main>
        <section>
            <h2>Film Arama</h2>

            <!-- Film arama alanı -->
            <div class="movie-search-box">
                <input type="text" id="filmAdi" placeholder="Film adı giriniz">
                <button type="button" onclick="filmAra()">Film Ara</button>
            </div>

            <!-- Hata / bilgi mesajı -->
            <p id="film-mesaj"></p>

            <!-- API'den gelen film bilgileri burada gösteriyorum -->
            <div id="movie-info"></div>
        </section>
    </main>

    <!-- ===== SAYFA ALTI ===== -->
    <footer>
        <p>2026 Web Teknolojileri Proje Ödevi</p>
    </footer>

    <script>
        function filmAra() {
            const apiKey = "99992f15726fd4411466c526efe591a6";
            const filmAdi = document.getElementById("filmAdi").value.trim();
            const movieInfo = document.getElementById("movie-info");
            const filmMesaj = document.getElementById("film-mesaj");

            movieInfo.innerHTML = "";
            filmMesaj.textContent = "";
            filmMesaj.style.color = "#555";

            if (filmAdi === "") {
                filmMesaj.textContent = "Lütfen aramak istediğiniz film adını yazınız.";
                filmMesaj.style.color = "red";
                return;
            }

            filmMesaj.textContent = "Film bilgileri yükleniyor...";

            const url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(filmAdi)}&language=tr-TR`;

            fetch(url)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (!data.results || data.results.length === 0) {
                        filmMesaj.textContent = "Aradığınız film bulunamadı.";
                        filmMesaj.style.color = "red";
                        return;
                    }

                    filmMesaj.textContent = "";

                    const film = data.results[0];

                    const posterUrl = film.poster_path
                        ? `https://image.tmdb.org/t/p/w500${film.poster_path}`
                        : "";

                    const aciklama = film.overview
                        ? film.overview
                        : "Bu film için Türkçe açıklama bulunmamaktadır.";

                    const yayinTarihi = film.release_date
                        ? film.release_date
                        : "Yayın tarihi bulunamadı.";

                    const puan = film.vote_average
                        ? film.vote_average
                        : "Puan bilgisi bulunamadı.";

                    movieInfo.innerHTML = `
                        <div class="movie-card">
                            <div class="movie-poster">
                                ${
                                    posterUrl
                                    ? `<img src="${posterUrl}" alt="${film.title} posteri">`
                                    : `<p>Bu film için poster bulunamadı.</p>`
                                }
                            </div>

                            <div class="movie-detail">
                                <h3>${film.title}</h3>
                                <p><strong>Açıklama:</strong> ${aciklama}</p>
                                <p><strong>Yayın Tarihi:</strong> ${yayinTarihi}</p>
                                <p><strong>Film Puanı:</strong> ${puan}</p>
                            </div>
                        </div>
                    `;
                })
                .catch(function () {
                    filmMesaj.textContent = "API bağlantısında bir hata oluştu. Lütfen internet bağlantınızı kontrol ediniz.";
                    filmMesaj.style.color = "red";
                });
        }
    </script>

</body>

</html>
