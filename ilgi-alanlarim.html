<body>

        </nav>

    <main>
        <section>
            <h2>Film Bilgileri</h2>
            <div id="movie-info">
                <!-- API'den gelen film verileri burada görünecek -->
            </div>
        </section>
    </main>
 
    <footer>
        <p>2026 Web Teknolojileri Proje Ödevi</p>
    </footer>
 
    <!-- jQuery ile API'den veri çekme -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // TMDb API'den popüler filmleri çekme
            // ✅ DEĞİŞEN SATIR: sonuna &language=tr-TR eklendi
            $.get('https://api.themoviedb.org/3/movie/popular?api_key=99992f15726fd4411466c526efe591a6&language=tr-TR', function (data) {
                console.log(data); // API yanıtını konsola yazdır
 
                // Film verilerini listeleme
                let movieInfo = '<ul>';
 
                data.results.forEach(function (movie) {
                    movieInfo += `
                    <li>
                        <h3>${movie.title}</h3>
                        <p>${movie.overview}</p>
                        <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    </li>
                `;
                });
 
                movieInfo += '</ul>';
 
                // Film bilgilerini sayfada göster
                $('#movie-info').html(movieInfo);
            });
        });
    </script>
 
</body>
 
</html>
