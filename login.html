<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

</head>

<body>

    <header>
        <h1>Login</h1>

        <nav>
            <a href="index.html">Ana Sayfa</a>

            <a href="iletisim.html">İletişim</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Kullanıcı Girişi</h2>

            <form action="login.php" method="POST" onsubmit="return loginKontrol()">

                <label for="email">Kullanıcı Adı / E-posta:</label>
                <input type="text" id="email" name="email" placeholder="b211111111@sakarya.edu.tr">

                <label for="password">Şifre:</label>
                <input type="password" id="password" name="password" autocomplete="off">
                <button type="submit">Giriş Yap</button>

            </form>
        </section>
    </main>

    <footer>
        <p>2026 Web Teknolojileri Proje Ödevi</p>
    </footer>

    <script>
        function loginKontrol() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            if (email === "" || password === "") {
                alert("Lütfen kullanıcı adı ve şifre alanlarını boş bırakmayınız.");
                return false;
            }

            if (!email.endsWith("@sakarya.edu.tr")) {
                alert("Kullanıcı adı Sakarya Üniversitesi mail formatında olmalıdır.");
                return false;
            }

            return true;
        }
    </script>

</body>

</html>
